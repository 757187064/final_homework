experiment:
  name: debug_smoke_test
  output_dir: outputs/debug_smoke_test
  seed: 42

data:
  root: data/raw
  train_csv: train.csv
  sample_submission: sample_submission.csv
  train_images: train_images
  test_images: test_images
  raw_height: 256
  raw_width: 1600
  image_height: 128
  image_width: 800
  include_empty_images: true
  val_ratio: 0.2
  num_workers: 0
  max_train_samples: 32
  max_val_samples: 16

model:
  architecture: unet
  encoder_name: resnet34
  encoder_weights: imagenet
  in_channels: 3
  classes: 4

train:
  epochs: 1
  batch_size: 2
  learning_rate: 0.0003
  weight_decay: 0.000001
  threshold: 0.5
  use_amp: false
  use_scheduler: false
  augmentation: light
  save_val_visuals: true
  val_visuals_count: 4

loss:
  bce_weight: 0.5
  dice_weight: 0.5
